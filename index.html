<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5dd07">
<title>Fetcher</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #eb4034;
    --bg-dark: #272929;
    --yellow: #f5dd07;
    --cyan: #07f5e5;
    --stop-blue: #0047AB;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    font-family: "IBM Plex Sans Arabic", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg-dark); color: #eee;
  }

  header {
    background: var(--yellow); padding: 14px 24px;
    display: block;
    position: sticky; top: 0; z-index: 20;
  }
  /* item 2/3: left-aligned title+date stack; item 2: 24.2px kept from
     before. item 3: yellow bg (matches digest group headers), text in the
     app's own dark background color, date a lighter shade of that same gray. */
  header .title { font-size: 24.2px; font-weight: 700; color: var(--bg-dark); text-align: left; letter-spacing: 0.01em; }
  header .header-date { font-size: 13px; color: rgba(39,41,41,0.65); margin-top: 2px; margin-left: 2px; text-align: left; }

  #view-landing {
    padding: 96px 24px 24px; text-align: center;
    display: flex; flex-direction: column; min-height: calc(100dvh - 80px);
  }
  .tile-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
    max-width: 420px; margin: 0 auto; width: 100%;
  }
  .tile {
    background: none; border: none; padding: 0; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    font-family: inherit; color: #eee;
  }
  /* item 1: box shrunk to 80% (-20%); icon glyph bumped 42% -> 52.5% of the
     smaller box so its ABSOLUTE on-screen size stays the same as before. */
  .tile-icon {
    width: 80%; aspect-ratio: 1; border-radius: 20px;
    background: #f1f1f1; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    transition: transform 0.12s ease;
  }
  .tile:active .tile-icon { transform: scale(0.94); }
  .tile-icon img { object-fit: contain; }
  /* item (this round): exact per-icon sizing, measured from each PNG's real
     alpha bounding box (not guessed) — every icon's own internal canvas
     padding differs slightly, so a single shared percentage either
     over- or under-sized some of them. Each value below is calibrated so
     the icon's VISIBLE glyph ends up the same on-screen size as the
     solid stop-square (which has zero internal padding, at 52.5%). */
  #run-btn .tile-icon img { width: 56.9%; height: 56.9%; }
  #csv-btn .tile-icon img { width: 60.9%; height: 60.9%; }
  #settings-btn .tile-icon img { width: 61.0%; height: 61.0%; }
  /* Latest's four-line icon recolored to match the stop-blue, via a CSS mask
     (the PNG supplies the shape from its alpha channel; background-color
     supplies the exact color - works regardless of whatever color was
     baked into the source image). Sizing below is measured, see comment
     above .tile-icon img. */
  .stop-square { width: 52.5%; height: 52.5%; background: var(--stop-blue); border-radius: 6px; }
  .latest-icon-mask {
    width: 64.9%; height: 64.9%; background-color: var(--stop-blue);
    -webkit-mask-image: url('Latest-1000.png'); mask-image: url('Latest-1000.png');
    -webkit-mask-size: contain; mask-size: contain;
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    -webkit-mask-position: center; mask-position: center;
  }
  .tile-label { font-size: 16px; font-weight: 600; }
  .tile-label.running { color: var(--yellow); }
  .tile:disabled { opacity: 0.5; pointer-events: none; }
  .tile .spinner {
    width: 28%; height: 28%; border: 3px solid rgba(0,0,0,0.15);
    border-top-color: #eb4034; border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* item 3/4: the simulated staged-progress panel. Sits as a grid item
     between the two tile rows - grid-column spans both columns, which
     pushes Settings/CSV down to a new row automatically. */
  /* The simulated staged-progress panel. Sits as a grid item between the
     two tile rows - grid-column spans both columns, which pushes
     Settings/CSV down to a new row automatically. Left/right margin is set
     precisely in JS (alignProgressPanel()), not guessed here as a
     percentage - the tile icons are inset within their grid columns by an
     amount that doesn't translate to a clean single percentage of the
     panel's own (different) width, so a CSS-only guess kept landing
     visibly off. margin:0 here is just the pre-JS fallback. */
  .run-progress-panel {
    display: none; grid-column: 1 / -1; margin: 0; background: #1e1f1f; border-radius: 16px;
    padding: 14px 18px; text-align: left; direction: ltr;
  }
  .rp-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .rp-stage-name { font-size: 14px; font-weight: 600; color: #eee; }
  .rp-step-counter { font-size: 12px; color: #999; }
  .rp-bar-track { width: 100%; height: 8px; background: #3a3b3b; border-radius: 4px; overflow: hidden; margin-bottom: 6px; }
  .rp-bar-fill { height: 100%; width: 0%; background: var(--yellow); transition: width 0.4s ease; border-radius: 4px; }
  #rp-timer { font-size: 12px; color: #888; text-align: right; }

  /* item 6: transient cues (was #landing-status) - auto-hidden after 5s by JS */
  #landing-status { padding: 18px 4px 4px; font-size: 13px; color: #aaa; text-align: center; min-height: 18px; }
  #landing-status.error { color: #ff8a80; font-weight: 600; }
  /* item 6: only one date now, pinned to the bottom of the landing view */
  /* footer date removed - the header date under "Fetcher" is the only one now */

  #settings-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 30;
    display: none; align-items: flex-end; justify-content: center;
  }
  #settings-overlay.open { display: flex; }
  .settings-sheet {
    background: #1c1d1d; width: 100%; max-width: 480px; border-radius: 18px 18px 0 0;
    padding: 20px 18px 28px; color: #eee;
  }
  .settings-sheet h2 { margin: 0 0 14px; font-size: 17px; color: white; }
  .settings-sheet label { font-size: 12px; color: #999; display: block; margin-bottom: 4px; }
  .settings-sheet input {
    width: 100%; padding: 12px; border: 1px solid #444; border-radius: 8px;
    font-size: 14px; margin-bottom: 12px; background: #2f3030; color: #eee;
  }
  .settings-sheet .hint { font-size: 11px; color: #888; line-height: 1.5; margin-bottom: 14px; }
  .settings-sheet .hint a { color: var(--cyan); }
  .settings-sheet button.save {
    width: 100%; padding: 13px; border: none; border-radius: 10px;
    background: var(--accent); color: white; font-size: 15px; font-weight: 700;
  }

  #view-digest { display: none; }
  #view-digest.active { display: block; }
  #view-landing.hidden { display: none; }

  /* item 9: date + count, left side as before, just a different content string */
  /* digest-meta removed - date + story count now live in the header itself
     (header-date), same as the landing page's title+date pattern, so both
     headers share identical structure/height. */

  /* item 7/8: category headers - RTL, clearly darker than the page background,
     bigger than before for hierarchy, with an expand/collapse chevron.
     item 8: bodies start collapsed; tapping a header toggles just that one. */
  section.group { margin-top: 6px; }
  .group-header {
    display: flex; align-items: center; justify-content: space-between; flex-direction: row-reverse;
    padding: 14px 16px; font-size: 18px; font-weight: 800; color: var(--yellow);
    background: #1e1f1f; border-bottom: 1px solid #3a3b3b; cursor: pointer;
  }
  .group-header-text { direction: rtl; text-align: right; }
  .group-count { color: #999; font-weight: 500; font-size: 13px; }
  .group-chevron {
    font-size: 13px; color: #999; display: inline-block;
    transition: transform 0.2s ease; margin-left: 4px;
  }
  .group-chevron.open { transform: rotate(90deg); }
  .group-body { display: none; }
  .group-body.open { display: block; }

  .story {
    display: flex; gap: 10px; align-items: flex-start; padding: 14px 16px;
    border-bottom: 1px solid var(--yellow); text-decoration: none; color: inherit;
  }
  .story-body { flex: 1; min-width: 0; }
  .story-title { font-size: 15px; font-weight: 700; line-height: 1.4; color: #fff; }
  .story-title.rtl { direction: rtl; text-align: right; }
  .story-title-en { font-size: 12px; color: #999; margin-top: 4px; font-style: italic; }
  .story-sub { font-size: 12px; color: #999; margin-top: 6px; }

  .region-divider {
    height: 0; border-top: 1px dashed #6a6b6b; margin: 10px 16px;
  }
  .empty-state { text-align: center; padding: 60px 20px; color: #777; }
  .empty-state .big { font-size: 40px; margin-bottom: 10px; }
</style>
</head>
<body>

<header>
  <div class="title" id="header-title">Fetcher</div>
  <div class="header-date" id="header-date"></div>
</header>

<div id="view-landing">
  <div class="tile-grid">
    <button class="tile" id="run-btn" onclick="handleRunTap()">
      <div class="tile-icon"><img src="Run-1000.png" alt=""></div>
      <div class="tile-label" id="run-label">Run</div>
    </button>
    <button class="tile" id="latest-btn" onclick="loadLatest()">
      <div class="tile-icon"><div class="latest-icon-mask"></div></div>
      <div class="tile-label" id="latest-label">Latest</div>
    </button>

    <div class="run-progress-panel" id="run-progress-panel">
      <div class="rp-row">
        <span class="rp-stage-name" id="rp-stage-name">-</span>
        <span class="rp-step-counter" id="rp-step-counter">Step 0/6</span>
      </div>
      <div class="rp-bar-track"><div class="rp-bar-fill" id="rp-bar-fill"></div></div>
      <div id="rp-timer">00:00</div>
    </div>

    <button class="tile" id="settings-btn" onclick="toggleSettings(true)">
      <div class="tile-icon"><img src="Settings-1000.png" alt=""></div>
      <div class="tile-label">Settings</div>
    </button>
    <button class="tile" id="csv-btn" onclick="downloadCsv()">
      <div class="tile-icon"><img src="CSV-1000.png" alt=""></div>
      <div class="tile-label" id="csv-label">CSV</div>
    </button>
  </div>

  <div id="landing-status"></div>
</div>

<div id="view-digest">
  <div id="content"></div>
</div>

<div id="settings-overlay" onclick="if(event.target===this) toggleSettings(false)">
  <div class="settings-sheet">
    <h2>&#9881; Settings</h2>
    <label for="gh-owner">GitHub username</label>
    <input id="gh-owner" placeholder="e.g. mskmd" autocomplete="off" autocapitalize="off">
    <label for="gh-repo">Repository name</label>
    <input id="gh-repo" placeholder="e.g. Viral-Engine" autocomplete="off" autocapitalize="off">
    <label for="gh-token">Personal Access Token</label>
    <input id="gh-token" type="password" placeholder="github_pat_..." autocomplete="off" autocapitalize="off">
    <div class="hint">
      Fine-grained token, scoped to this one repo only, with "Actions: Read & write" and
      "Contents: Read" permissions. Generate at
      <a href="https://github.com/settings/personal-access-tokens/new" target="_blank">github.com/settings/personal-access-tokens/new</a>.
      Stored only on this device - never sent anywhere except GitHub's API.
    </div>
    <button class="save" onclick="saveSettings()">Save</button>
  </div>
</div>

<script>
const CSV_PATH = 'latest_digest.csv';

function getConfig() {
  return {
    owner: localStorage.getItem('gh_owner') || '',
    repo: localStorage.getItem('gh_repo') || '',
    token: localStorage.getItem('gh_token') || '',
  };
}
function isConfigured() {
  const c = getConfig();
  return c.owner && c.repo && c.token;
}
function toggleSettings(open) {
  const overlay = document.getElementById('settings-overlay');
  if (open) {
    document.getElementById('gh-owner').value = localStorage.getItem('gh_owner') || '';
    document.getElementById('gh-repo').value = localStorage.getItem('gh_repo') || '';
    document.getElementById('gh-token').value = localStorage.getItem('gh_token') || '';
    overlay.classList.add('open');
  } else {
    overlay.classList.remove('open');
  }
}
function saveSettings() {
  localStorage.setItem('gh_owner', document.getElementById('gh-owner').value.trim());
  localStorage.setItem('gh_repo', document.getElementById('gh-repo').value.trim());
  localStorage.setItem('gh_token', document.getElementById('gh-token').value.trim());
  toggleSettings(false);
}
function ghHeaders() {
  const c = getConfig();
  return {
    'Authorization': `Bearer ${c.token}`,
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28',
  };
}

// item 11 (prior round): back navigation via the History API - a pushed
// history entry on entering the digest view means Android's swipe/hardware
// back does the right thing (returns to the tile grid) instead of exiting
// the app outright. item 6 (this round): the on-screen back arrow is gone -
// swipe/hardware back is the only way back now, but it still needs this
// same pushState/popstate plumbing to work at all.
function todayDateString() {
  return new Date().toLocaleDateString('en-GB', {
    weekday: 'long', day: '2-digit', month: 'long', year: 'numeric',
  });
}
function goToDigest() {
  document.getElementById('view-landing').classList.add('hidden');
  document.getElementById('view-digest').classList.add('active');
  // Header title/date for this view are set by renderDigest() itself now
  // (it has the date + count in hand already) - not duplicated here.
  history.pushState({ view: 'digest' }, '', '#digest');
}
function showLandingView() {
  document.getElementById('view-digest').classList.remove('active');
  document.getElementById('view-landing').classList.remove('hidden');
  // item 2: header reverts to the app name + today's date underneath.
  document.getElementById('header-title').textContent = 'Fetcher';
  document.getElementById('header-date').textContent = todayDateString();
}
window.addEventListener('popstate', () => showLandingView());

// item 6: status cues now auto-clear after 5 seconds instead of persisting
// until overwritten by the next one.
let statusTimeout = null;
function setStatus(msg, isError) {
  const el = document.getElementById('landing-status');
  el.textContent = msg;
  el.className = isError ? 'error' : '';
  if (statusTimeout) clearTimeout(statusTimeout);
  if (msg) {
    statusTimeout = setTimeout(() => { el.textContent = ''; el.className = ''; }, 5000);
  }
}

async function latestRunId() {
  const c = getConfig();
  try {
    const resp = await fetch(
      `https://api.github.com/repos/${c.owner}/${c.repo}/actions/workflows/run.yml/runs?per_page=1`,
      { headers: ghHeaders() }
    );
    const data = await resp.json();
    const run = data.workflow_runs && data.workflow_runs[0];
    return run ? run.id : null;
  } catch (e) { return null; }
}

// Generic busy/idle helpers - still used by Latest/CSV (which just spin and
// re-enable). The Run tile has its own dedicated logic below because it
// needs to stay tappable while "busy" (to allow Stop) and its icon swaps to
// a distinct blue square rather than a spinner.
function setTileBusy(tileId, labelId, busyText) {
  const tile = document.getElementById(tileId);
  const iconBox = tile.querySelector('.tile-icon');
  tile.disabled = true;
  iconBox.dataset.origHtml = iconBox.dataset.origHtml || iconBox.innerHTML;
  iconBox.innerHTML = '<span class="spinner"></span>';
  document.getElementById(labelId).textContent = busyText;
}
function setTileIdle(tileId, labelId, idleText) {
  const tile = document.getElementById(tileId);
  const iconBox = tile.querySelector('.tile-icon');
  tile.disabled = false;
  if (iconBox.dataset.origHtml) iconBox.innerHTML = iconBox.dataset.origHtml;
  document.getElementById(labelId).textContent = idleText;
}

// -- item 3/4/5: Run tile state machine + simulated staged progress --------
//
// GitHub's Actions API only reports queued / in_progress / completed for a
// whole workflow run - it has no concept of "internal step 3 of 6". There is
// no channel back from viral_engine.py to this app mid-run (that would need
// the workflow to publish progress somewhere pollable, which is out of scope
// here). So the per-stage breakdown below is a SIMULATION: named stages with
// rough relative-duration weights, estimated from real run logs, advanced by
// elapsed wall-clock time against a rough historical baseline. It is honest
// about being an estimate - it deliberately caps at 97% while still polling
// and only ever reaches 100% at the moment the real GitHub status flips to
// completed, so it can undersell but never oversell progress.
const RUN_STAGES = [
  { name: 'Harvesting sources', weight: 30 },
  { name: 'Scoring stories', weight: 35 },
  { name: 'Ranking & capping', weight: 8 },
  { name: 'Translating', weight: 17 },
  { name: 'Deduping', weight: 5 },
  { name: 'Sending digest', weight: 5 },
];
const RUN_STAGE_TOTAL_WEIGHT = RUN_STAGES.reduce((a, s) => a + s.weight, 0);
const RUN_BASELINE_MS = 20 * 60 * 1000; // rough historical average sweep time

const runState = { active: false, sawOurRun: false, runId: null, cancelled: false, startedAt: null };
let runTimerInterval = null;

// Measures the actual rendered tile icons and sets the panel's margins in
// real pixels to match their edges exactly - CSS percentage guesses at this
// kept landing visibly off (the tiles are inset within their own grid
// columns, and the panel spans a different-width box, so a single %
// doesn't translate cleanly between the two). Re-run on resize/orientation
// change so it stays correct.
function alignProgressPanel() {
  const panel = document.getElementById('run-progress-panel');
  const grid = document.querySelector('.tile-grid');
  const leftIcon = document.querySelector('#run-btn .tile-icon');
  const rightIcon = document.querySelector('#csv-btn .tile-icon');
  if (!panel || !grid || !leftIcon || !rightIcon) return;
  const gridRect = grid.getBoundingClientRect();
  const leftRect = leftIcon.getBoundingClientRect();
  const rightRect = rightIcon.getBoundingClientRect();
  const leftInset = Math.max(leftRect.left - gridRect.left, 0);
  const rightInset = Math.max(gridRect.right - rightRect.right, 0);
  panel.style.marginLeft = `${leftInset}px`;
  panel.style.marginRight = `${rightInset}px`;
}
window.addEventListener('resize', alignProgressPanel);

function setRunIconIdle() {
  document.querySelector('#run-btn .tile-icon').innerHTML = '<img src="Run-1000.png" alt="">';
}
function setRunIconActive() {
  document.querySelector('#run-btn .tile-icon').innerHTML = '<div class="stop-square"></div>';
}

function updateStageDisplay() {
  const elapsed = Date.now() - runState.startedAt;
  const mins = Math.floor(elapsed / 60000), secs = Math.floor((elapsed % 60000) / 1000);
  document.getElementById('rp-timer').textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

  if (!runState.sawOurRun) {
    document.getElementById('rp-stage-name').textContent = 'Queued - waiting for a runner...';
    document.getElementById('rp-step-counter').textContent = `Step 0/${RUN_STAGES.length}`;
    document.getElementById('rp-bar-fill').style.width = '0%';
    return;
  }

  const frac = Math.min(elapsed / RUN_BASELINE_MS, 0.97);
  const target = frac * RUN_STAGE_TOTAL_WEIGHT;
  let acc = 0, idx = RUN_STAGES.length - 1, withinFrac = 1;
  for (let i = 0; i < RUN_STAGES.length; i++) {
    const w = RUN_STAGES[i].weight;
    if (target < acc + w) { idx = i; withinFrac = w > 0 ? (target - acc) / w : 1; break; }
    acc += w;
  }
  document.getElementById('rp-stage-name').textContent = RUN_STAGES[idx].name;
  document.getElementById('rp-step-counter').textContent = `Step ${idx + 1}/${RUN_STAGES.length}`;
  document.getElementById('rp-bar-fill').style.width = `${Math.round(withinFrac * 100)}%`;
}
function startStageTimer() {
  if (runTimerInterval) clearInterval(runTimerInterval);
  updateStageDisplay();
  runTimerInterval = setInterval(updateStageDisplay, 500);
}

// Split in two: resetRunVisuals() is safe to call anytime (just DOM), while
// resetRunState() clears the tracking flags. stopRun() used to call a
// combined reset that wiped runState.cancelled back to false in the same
// synchronous tick it had just set it to true - the concurrently-running
// pollRun() loop never got a chance to observe the cancellation at all, so
// Stop silently did nothing. Keeping these separate lets stopRun() give
// instant UI feedback without clobbering the signal pollRun() depends on.
function resetRunVisuals() {
  setRunIconIdle();
  document.getElementById('run-label').textContent = 'Run';
  document.getElementById('run-label').classList.remove('running');
  document.getElementById('run-progress-panel').style.display = 'none';
  if (runTimerInterval) { clearInterval(runTimerInterval); runTimerInterval = null; }
}
function resetRunState() {
  runState.active = false;
  runState.sawOurRun = false;
  runState.runId = null;
  runState.cancelled = false;
}
function resetRunUI() {
  resetRunVisuals();
  resetRunState();
}

function handleRunTap() {
  if (runState.active) stopRun(); else triggerRun();
}

async function triggerRun() {
  if (!isConfigured()) { toggleSettings(true); return; }
  if (runState.active) return;

  runState.active = true;
  runState.sawOurRun = false;
  runState.runId = null;
  runState.cancelled = false;
  runState.startedAt = Date.now();
  setRunIconActive();
  document.getElementById('run-label').textContent = 'Running...';
  document.getElementById('run-label').classList.add('running');
  document.getElementById('run-progress-panel').style.display = 'block';
  alignProgressPanel();
  startStageTimer();

  const c = getConfig();
  try {
    // Record the newest existing run BEFORE dispatching. GitHub takes a few
    // seconds to register a dispatched run, so polling "the newest run" right
    // after a POST can pick up the PREVIOUS run - which is already completed -
    // and instantly declare success while loading a stale digest.
    const priorRunId = await latestRunId();
    if (runState.cancelled) return;

    const dispatchResp = await fetch(
      `https://api.github.com/repos/${c.owner}/${c.repo}/actions/workflows/run.yml/dispatches`,
      { method: 'POST', headers: { ...ghHeaders(), 'Content-Type': 'application/json' },
        body: JSON.stringify({ ref: 'main' }) }
    );
    if (dispatchResp.status !== 204) {
      throw new Error(`GitHub rejected the trigger (HTTP ${dispatchResp.status}). Check token permissions.`);
    }
    setStatus('Run started.');
    await pollRun(priorRunId);
  } catch (e) {
    setStatus(e.message, true);
    resetRunUI();
  }
}

async function pollRun(priorRunId) {
  const c = getConfig();
  const pollStartedAt = Date.now();
  const maxWaitMs = 50 * 60 * 1000;   // workflow timeout is 45 min

  async function fetchLatestRun() {
    const resp = await fetch(
      `https://api.github.com/repos/${c.owner}/${c.repo}/actions/workflows/run.yml/runs?per_page=1`,
      { headers: ghHeaders() }
    );
    const data = await resp.json();
    return data.workflow_runs && data.workflow_runs[0];
  }

  while (Date.now() - pollStartedAt < maxWaitMs) {
    // stopRun() now owns cancellation entirely - it sweeps every in-progress
    // and queued run of this workflow directly, rather than this loop trying
    // to identify and cancel one specific run id. Simpler and more robust:
    // it works even if Stop is tapped before this loop ever learns an id,
    // and it also catches any orphaned run left over from an earlier tap.
    // resetRunState() is called ONLY here, once this loop has actually
    // observed the cancellation - stopRun() must NOT call it (an earlier
    // version did, "for tidiness", and that's exactly what silently broke
    // cancellation the second time: cancelAllRuns() resolves fast enough
    // that resetRunState() was clobbering runState.cancelled back to false
    // before this loop's next check ever ran).
    if (runState.cancelled) { resetRunState(); return; }
    await new Promise(r => setTimeout(r, runState.sawOurRun ? 20000 : 5000));
    if (runState.cancelled) { resetRunState(); return; }
    try {
      const run = await fetchLatestRun();
      if (!run) continue;

      // Ignore anything that isn't the run we just started.
      if (priorRunId !== null && run.id === priorRunId) continue;

      if (!runState.sawOurRun) {
        runState.sawOurRun = true;
        runState.runId = run.id;
      }

      if (run.status === 'completed') {
        resetRunState();
        if (run.conclusion === 'success') {
          setStatus('Run finished - loading digest...');
          await loadLatest();
        } else {
          setStatus(`Run finished with status: ${run.conclusion}.`, true);
        }
        return;
      }
    } catch (e) {
      // Transient network/API blip - keep polling rather than aborting the run.
    }
  }
  setStatus('Still polling after 50 min - check GitHub Actions directly.', true);
  resetRunState();
}

// Cancels EVERY in-progress or queued run of this specific workflow, not
// just the one this session happens to be tracking. Scoped to run.yml only
// (not every workflow in the repo, in case others ever get added). This is
// what actually closes the gap that made Stop unreliable: tapping Run more
// than once in a session (very easy to do while testing) leaves earlier
// runs dispatched and unattended - stopping "the current one" never touched
// those. A blanket sweep does, and it doesn't need to know any specific run
// id ahead of time either, so there's no early-tap timing window to miss.
async function cancelAllRuns() {
  const c = getConfig();
  let cancelled = 0, failed = 0;
  for (const status of ['in_progress', 'queued']) {
    try {
      const resp = await fetch(
        `https://api.github.com/repos/${c.owner}/${c.repo}/actions/workflows/run.yml/runs?status=${status}&per_page=100`,
        { headers: ghHeaders() }
      );
      if (!resp.ok) { failed++; continue; }
      const data = await resp.json();
      const runs = data.workflow_runs || [];
      for (const run of runs) {
        try {
          const cancelResp = await fetch(
            `https://api.github.com/repos/${c.owner}/${c.repo}/actions/runs/${run.id}/cancel`,
            { method: 'POST', headers: ghHeaders() }
          );
          if (cancelResp.status === 202) cancelled++; else failed++;
        } catch (e) { failed++; }
      }
    } catch (e) { failed++; }
  }
  return { cancelled, failed };
}

async function stopRun() {
  if (!runState.active) return;
  runState.cancelled = true;
  runState.active = false;   // safe to flip immediately - nothing else reads
                              // this concurrently, unlike `cancelled` below
  resetRunVisuals();
  setStatus('Cancelling all runs...');
  const { cancelled, failed } = await cancelAllRuns();
  if (cancelled > 0 && failed === 0) {
    setStatus(`Cancelled ${cancelled} run${cancelled > 1 ? 's' : ''}.`);
  } else if (cancelled > 0 && failed > 0) {
    setStatus(`Cancelled ${cancelled}, but ${failed} failed - check GitHub Actions.`, true);
  } else if (failed > 0) {
    setStatus('Cancel FAILED - check GitHub Actions directly.', true);
  } else {
    setStatus('No runs were active to cancel.');
  }
  // No resetRunState() here - see the comment in pollRun()'s loop above.
  // runState.cancelled stays true; pollRun() clears it (and sawOurRun/runId)
  // once its own loop actually observes it and exits.
}

// Shared by "Latest" (renders cards) and "CSV" (downloads the raw file) -
// both just need the current latest_digest.csv content from the repo.
async function fetchLatestCsv() {
  const c = getConfig();
  // cache-bust: the Contents API can serve a stale copy for a few seconds
  // right after the workflow pushes, which would show the previous digest.
  const resp = await fetch(
    `https://api.github.com/repos/${c.owner}/${c.repo}/contents/${CSV_PATH}?t=${Date.now()}`,
    { headers: { ...ghHeaders(), 'Accept': 'application/vnd.github.raw+json' }, cache: 'no-store' }
  );
  if (resp.status === 404) throw new Error('No digest found yet - run it at least once.');
  if (!resp.ok) throw new Error(`Could not load digest (HTTP ${resp.status}).`);
  return resp.text();
}

// item 9: the last commit touching latest_digest.csv tells us when the
// engine actually produced this digest (far more meaningful than "today").
async function fetchDigestCommitDate() {
  const c = getConfig();
  try {
    const resp = await fetch(
      `https://api.github.com/repos/${c.owner}/${c.repo}/commits?path=${CSV_PATH}&per_page=1`,
      { headers: ghHeaders() }
    );
    if (!resp.ok) return null;
    const data = await resp.json();
    const iso = data && data[0] && data[0].commit && data[0].commit.committer && data[0].commit.committer.date;
    return iso ? new Date(iso) : null;
  } catch (e) { return null; }
}

async function loadLatest() {
  if (!isConfigured()) { toggleSettings(true); return; }
  setTileBusy('latest-btn', 'latest-label', 'Loading...');
  setStatus('Loading latest digest...');
  try {
    const [csvText, commitDate] = await Promise.all([fetchLatestCsv(), fetchDigestCommitDate()]);
    renderDigest(csvText, commitDate);
    setStatus('');
    goToDigest();
  } catch (e) {
    setStatus(e.message, true);
  } finally {
    setTileIdle('latest-btn', 'latest-label', 'Latest');
  }
}

async function downloadCsv() {
  if (!isConfigured()) { toggleSettings(true); return; }
  setTileBusy('csv-btn', 'csv-label', 'Downloading...');
  setStatus('Downloading CSV...');
  try {
    const csvText = await fetchLatestCsv();
    // Prepend a BOM so Arabic text opens correctly in Excel/Sheets, matching
    // how the engine itself writes the file (utf-8-sig).
    const blob = new Blob(['\uFEFF' + csvText], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0, 16).replace(/[-:T]/g, '');
    a.href = url;
    a.download = `viral_digest_${stamp}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    setStatus('CSV downloaded.');
  } catch (e) {
    setStatus(e.message, true);
  } finally {
    setTileIdle('csv-btn', 'csv-label', 'CSV');
  }
}

function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], next = text[i + 1];
    if (inQuotes) {
      if (c === '"' && next === '"') { field += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else { field += c; }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && next === '\n') i++;
        row.push(field); rows.push(row); row = []; field = '';
      } else { field += c; }
    }
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || r[0]);
}
function isArabic(s) { return /[\u0600-\u06FF]/.test(s || ''); }
function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// item 8: expand/collapse - independent per category, all start collapsed.
function toggleGroup(key) {
  const body = document.getElementById(`body-${key}`);
  const chevron = document.getElementById(`chevron-${key}`);
  const isOpen = body.classList.toggle('open');
  chevron.classList.toggle('open', isOpen);
}

function renderDigest(csvText, commitDate) {
  const rows = parseCSV(csvText);
  const content = document.getElementById('content');
  document.getElementById('header-title').textContent = 'Stories';
  if (rows.length < 2) {
    content.innerHTML = '<div class="empty-state"><div class="big">&#128235;</div>No stories in the latest digest.</div>';
    document.getElementById('header-date').textContent = '';
    return;
  }
  // The engine writes the CSV as utf-8-sig, so the first header cell carries a
  // BOM ("\uFEFFPlatform"). Without stripping it, indexOf('Platform') returns -1
  // and every story's platform is undefined - which silently renders an empty
  // digest. Trim the BOM (and stray whitespace) from every header cell.
  const header = rows[0].map(h => (h || '').replace(/^\uFEFF/, '').trim());
  const idx = name => header.indexOf(name);
  const stories = rows.slice(1).map(r => ({
    platform: r[idx('Platform')], score: r[idx('Score')], lang: r[idx('Language')],
    region: r[idx('Region')],
    title: r[idx('Title')], titleAr: r[idx('Title_AR')],
    source: r[idx('Source')], date: r[idx('Date')], link: r[idx('Link')],
  }));

  // Order mirrors the email digest: Crime and Bizarre first for fast scanning,
  // then the platform sections.
  const groups = [
    { key: 'FEATURED',  label: 'أبرز القصص' },
    { key: 'CRIME',     label: 'جرائم' },
    { key: 'BIZARRE',   label: 'غرائب' },
    { key: 'STATEMENT', label: 'تصريحات' },
    { key: 'RSS',       label: 'تقارير', regionSplit: true },
    { key: 'X',         label: 'تويتر' },
  ];

  // Safety net: if the engine ever emits a Platform value this app doesn't
  // know about, show it in its own trailing section rather than silently
  // dropping those stories.
  const knownKeys = new Set(groups.map(g => g.key));
  const unknownKeys = [...new Set(stories.map(s => s.platform).filter(p => p && !knownKeys.has(p)))];
  for (const k of unknownKeys) groups.push({ key: k, label: k });

  let html = '';
  let total = 0;
  for (const g of groups) {
    const items = stories.filter(s => s.platform === g.key);
    if (!items.length) continue;
    total += items.length;

    let body = '';
    let prevRegion = null;
    items.forEach((s, i) => {
      // RSS is region-grouped (Arab world first, then global) with a plain
      // divider and no region label - matches the email digest layout.
      if (g.regionSplit) {
        if (prevRegion !== null && s.region !== prevRegion) {
          body += '<div class="region-divider"></div>';
        }
        prevRegion = s.region;
      }
      const displayTitle = s.lang === 'ar' ? s.title : (s.titleAr || s.title);
      const rtl = isArabic(displayTitle);
      const showOriginal = s.lang !== 'ar' && s.titleAr;
      body += `<a class="story" href="${escapeHtml(s.link)}" target="_blank" rel="noopener">
        <div class="story-body">
          <div class="story-title ${rtl ? 'rtl' : ''}">${escapeHtml(displayTitle)}</div>
          ${showOriginal ? `<div class="story-title-en">${escapeHtml(s.title)}</div>` : ''}
          <div class="story-sub">${escapeHtml(s.source)} &middot; ${escapeHtml(s.date)}</div>
        </div>
      </a>`;
    });

    // item 7: RTL header, darker background than the page, bigger text.
    // item 8: starts collapsed - tap the header to open just that category.
    // FEATURED starts open, everything else starts collapsed underneath it -
    // per explicit request: tapping Latest should land on the highlight
    // reel expanded, not require an extra tap to see it.
    const startsOpen = g.key === 'FEATURED';
    html += `<section class="group">
      <div class="group-header" onclick="toggleGroup('${g.key}')">
        <span class="group-header-text">${g.label} <span class="group-count">(${items.length})</span></span>
        <span class="group-chevron${startsOpen ? ' open' : ''}" id="chevron-${g.key}">&#9656;</span>
      </div>
      <div class="group-body${startsOpen ? ' open' : ''}" id="body-${g.key}">${body}</div>
    </section>`;
  }

  // Date of the digest (from the file's last commit, formatted DD/MM/YYYY)
  // + story count, shown in the header as the "Stories" subtitle - same
  // slot/pattern as "Fetcher"'s date on the landing page.
  if (commitDate) {
    const dateStr = commitDate.toLocaleDateString('en-GB');   // en-GB default = DD/MM/YYYY
    document.getElementById('header-date').textContent = `${dateStr} (${total})`;
  } else {
    document.getElementById('header-date').textContent = `(${total})`;
  }
  content.innerHTML = html || '<div class="empty-state"><div class="big">&#128235;</div>Empty digest.</div>';
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// item: date under the app name in the header. The old bottom-of-page
// footer date has been removed per explicit request - this is the only
// date shown now.
document.getElementById('header-date').textContent = todayDateString();
</script>
</body>
</html>
